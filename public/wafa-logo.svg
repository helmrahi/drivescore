<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond jaune/or -->
  <rect width="100" height="100" rx="16" fill="#F5A623"/>
  
  <!-- Bande noire horizontale au milieu -->
  <rect x="0" y="46" width="100" height="12" fill="#1A1A1A"/>
  
  <!-- Triangle noir (V inversé) -->
  <polygon points="0,46 50,82 100,46 100,58 50,94 0,58" fill="#1A1A1A"/>
  
  <!-- Zone verte bas -->
  <polygon points="0,58 50,94 100,58 100,100 0,100" fill="#4CAF50"/>
  
  <!-- Petit carré noir en haut -->
  <rect x="43" y="22" width="14" height="14" rx="2" fill="#1A1A1A"/>
</svg>